<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para a Júlia ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:#fff;
}
.card{
  width:min(90%,430px); padding:35px 24px; text-align:center;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  border-radius:28px; backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(120,30,60,.25);
  position:relative; z-index:2;
}
h1{font-size:30px;margin:8px 0 12px}
p{font-size:18px;line-height:1.5;margin:8px 0 24px}
.buttons{height:120px;position:relative}
button{
  border:0;border-radius:999px;padding:14px 28px;font-size:18px;
  font-weight:bold;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.15);
}
#yes{background:#fff;color:#e94f75}
#no{background:#e94f75;color:#fff;position:absolute;left:52%;top:10px;transition:left .08s,top .08s}
.hidden{display:none}
.heart{position:fixed;bottom:-30px;font-size:24px;animation:up 5s linear forwards;opacity:.8}
@keyframes up{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
#success h1{font-size:38px}
#success p{font-size:22px}
</style>
</head>
<body>
<div class="card" id="question">
  <div style="font-size:52px">❤️</div>
  <h1>Júlia, quer namorar comigo?</h1>
  <p>Tenho uma perguntinha muito importante para ti... 🥹</p>
  <div class="buttons">
    <button id="yes">SIM ❤️</button>
    <button id="no">NÃO</button>
  </div>
</div>

<div class="card hidden" id="success">
  <div style="font-size:70px">🥹❤️</div>
  <h1>Ebaaa!</h1>
  <p>Prometo te fazer sorrir todos os dias. ❤️</p>
  <p style="font-size:16px">— Logan</p>
</div>

<script>
const no = document.getElementById("no");
const area = document.querySelector(".buttons");

function fugir(){
  const maxX = Math.max(0, area.clientWidth - no.offsetWidth);
  const maxY = Math.max(0, area.clientHeight - no.offsetHeight);
  no.style.left = Math.floor(Math.random()*maxX) + "px";
  no.style.top = Math.floor(Math.random()*maxY) + "px";
}
["mouseenter","pointerdown","touchstart","click"].forEach(e => no.addEventListener(e, fugir));

document.getElementById("yes").addEventListener("click",()=>{
  document.getElementById("question").classList.add("hidden");
  document.getElementById("success").classList.remove("hidden");
  for(let i=0;i<35;i++) setTimeout(createHeart,i*80);
});

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💕","💗","💖","💘"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6500);
}
setInterval(createHeart,700);
</script>
</body>
</html>
