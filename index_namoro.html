<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uma pergunta ❤️</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#ffd6e8,#e9d7ff);overflow:hidden}.box{background:white;padding:32px 24px;border-radius:28px;text-align:center;width:min(90%,430px);box-shadow:0 12px 35px #0002}h1{color:#e84d91}p{font-size:19px;color:#444}button{border:0;border-radius:16px;padding:14px 28px;margin:8px;font-size:18px;cursor:pointer}#sim{background:#ff65a5;color:white}#nao{background:#eee}.hidden{display:none}.heart{font-size:48px}</style></head><body><div class="box" id="pergunta"><div class="heart">❤️</div><h1>Queres namorar comigo?</h1><p>Tenho uma pergunta muito importante para ti... 🥹</p><button id="sim" onclick="sim()">SIM ❤️</button><button id="nao" onmouseover="fugir()" onclick="fugir()">NÃO 😭</button></div><div class="box hidden" id="final"><div class="heart">🥹❤️</div><h1>Sabia! ❤️</h1><p>Então é oficial! 💕</p><p>Espero que este seja o começo de muitos momentos incríveis juntos. 🫶</p></div><script>function sim(){document.getElementById('pergunta').classList.add('hidden');document.getElementById('final').classList.remove('hidden')}function fugir(){const b=document.getElementById('nao');b.style.position='fixed';b.style.left=Math.random()*75+'vw';b.style.top=Math.random()*75+'vh'}</script></body></html>
