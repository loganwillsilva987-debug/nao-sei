<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Uma pergunta ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e8,#e9d7ff)}.box{background:#fff;padding:30px 20px;border-radius:28px;text-align:center;width:min(90%,430px);box-shadow:0 12px 35px #0002}h1{color:#e84d91}p{font-size:19px;color:#444}.area{position:relative;height:180px;width:100%;margin-top:15px}button{border:0;border-radius:16px;padding:14px 26px;font-size:18px;cursor:pointer;position:absolute;top:45px}#sim{background:#ff65a5;color:white;left:calc(50% - 125px)}#nao{background:#eee;color:#555;left:calc(50% + 25px)}.hidden{display:none}.heart{font-size:48px}
</style></head>
<body>
<div class="box" id="pergunta"><div class="heart">❤️</div><h1>Queres namorar comigo?</h1><p>Tenho uma pergunta muito importante para ti... 🥹</p>
<div class="area" id="area"><button id="sim" onclick="aceitar()">SIM ❤️</button><button id="nao">NÃO 😭</button></div></div>
<div class="box hidden" id="final"><div class="heart">🥹❤️</div><h1>Sabia! ❤️</h1><p>Então é oficial! 💕</p><p>Espero que este seja o começo de muitos momentos incríveis juntos. 🫶</p></div>
<script>
const nao=document.getElementById("nao"),area=document.getElementById("area");
function aceitar(){document.getElementById("pergunta").classList.add("hidden");document.getElementById("final").classList.remove("hidden")}
function fugir(){
 const sim=document.getElementById("sim"),a=area.getBoundingClientRect(),s=sim.getBoundingClientRect();
 const maxX=area.clientWidth-nao.offsetWidth,maxY=area.clientHeight-nao.offsetHeight;
 let x=0,y=0,ok=false;
 for(let i=0;i<200;i++){x=Math.random()*Math.max(0,maxX);y=Math.random()*Math.max(0,maxY);
  const n={l:a.left+x,r:a.left+x+nao.offsetWidth,t:a.top+y,b:a.top+y+nao.offsetHeight};
  const d=Math.hypot((n.l+n.r)/2-(s.left+s.right)/2,(n.t+n.b)/2-(s.top+s.bottom)/2);
  if(d>170){ok=true;break}}
 if(ok){nao.style.left=x+"px";nao.style.top=y+"px"}
}
nao.addEventListener("mouseenter",fugir);
nao.addEventListener("touchstart",e=>{e.preventDefault();fugir()},{passive:false});
</script></body></html>
